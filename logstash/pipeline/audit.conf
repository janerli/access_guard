input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}"
    topics => ["audit.events"]
    group_id => "logstash-audit"
    consumer_threads => 2
    auto_offset_reset => "earliest"
    codec => "json"
    decorate_events => true
  }
}

filter {
  # The Kafka message is a KafkaEvent envelope:
  # { event_id, event_type, occurred_at, producer, correlation_id, version,
  #   payload: { event_id, audit_log_id, timestamp, actor_username, ... } }
  #
  # We flatten payload fields to document root FIRST, then set @timestamp.
  # Fields from payload override KafkaEvent wrapper fields (e.g. correlation_id).

  if [payload] {
    # CRITICAL: KafkaEvent-обёртка имеет СВОИ event_id и correlation_id (uuid4)
    # на верхнем уровне. Если их не удалить, add_field ниже превратит поля
    # в МАССИВЫ [wrapper_uuid, audit_uuid] → кривой document_id и сломанные
    # correlation-цепочки. Также удаляем прочие поля обёртки (шум в ES).
    mutate {
      remove_field => ["event_id", "correlation_id", "event_type", "occurred_at", "producer", "version"]
    }
    mutate {
      # Copy all audit fields from payload to document root.
      # add_field with %{} syntax always creates strings — convert numerics below.
      add_field => {
        "event_id"        => "%{[payload][event_id]}"
        "audit_log_id"    => "%{[payload][audit_log_id]}"
        "timestamp"       => "%{[payload][timestamp]}"
        "actor_id"        => "%{[payload][actor_id]}"
        "actor_username"  => "%{[payload][actor_username]}"
        "target_type"     => "%{[payload][target_type]}"
        "target_id"       => "%{[payload][target_id]}"
        "operation"       => "%{[payload][operation]}"
        "module"          => "%{[payload][module]}"
        "result"          => "%{[payload][result]}"
        "user_agent"      => "%{[payload][user_agent]}"
        "correlation_id"  => "%{[payload][correlation_id]}"
      }
    }

    # ip_address: only copy if present and non-null (type 'ip' rejects nulls)
    if [payload][ip_address] and [payload][ip_address] != "" {
      mutate {
        add_field => { "ip_address" => "%{[payload][ip_address]}" }
      }
    }

    # department_code / position_code: only copy if present and non-null
    if [payload][department_code] and [payload][department_code] != "" {
      mutate {
        add_field => { "department_code" => "%{[payload][department_code]}" }
      }
    }
    if [payload][position_code] and [payload][position_code] != "" {
      mutate {
        add_field => { "position_code" => "%{[payload][position_code]}" }
      }
    }

    # Move nested details object to top level without stringifying
    if [payload][details] {
      mutate {
        rename => { "[payload][details]" => "details" }
      }
    }

    mutate { remove_field => ["payload"] }
  }

  # Set @timestamp from the event's actual timestamp (now at top level).
  # Runs AFTER payload flatten so [timestamp] is available.
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Convert audit_log_id from string (add_field creates strings) to integer.
  # Logstash mutate не имеет типа "long" — его "integer" внутри 64-битный (Java Long),
  # так что переполнения нет, а ES-маппинг поля остаётся "long".
  if [audit_log_id] {
    mutate {
      convert => { "audit_log_id" => "integer" }
    }
  }

  # Remove unresolved Logstash template placeholders (e.g. "%{[payload][field]}")
  # that appear when a payload field was absent. These would corrupt ES documents.
  ruby {
    code => "
      event.to_hash.each do |key, value|
        if value.is_a?(String) && value.start_with?('%{')
          event.remove(key)
        end
      end
    "
  }

  mutate { remove_field => ["@version"] }
}

output {
  # Only write documents that have a valid event_id (prevents phantom overwrites)
  if [event_id] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
      index => "audit-events-%{+YYYY.MM}"
      document_id => "%{event_id}"
      action => "index"
    }
  }
}
